version: 2

project_name: prospabitus

before:
  hooks:
    - go test ./...

builds:
  - main: ./cmd/prospabitus
    binary: prospabitus
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/rokoucha/prospabitus/internal/cli.Version={{.Version}}
      - -X github.com/rokoucha/prospabitus/internal/cli.Commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - assets/SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: prospabitus
    binaries: [prospabitus]
    homepage: https://github.com/rokoucha/prospabitus
    description: Archive local coding-agent sessions for search and retrospection
    repository:
      owner: rokoucha
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/prospabitus"],
                                 writable_paths: ["prospabitus"]
          end
