version: 2

project_name: prospabitus

before:
  hooks:
    - go test ./...

builds:
  - main: ./cmd/prospabitus
    binary: prospabitus
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/rokoucha/prospabitus/internal/cli.Version={{.Version}}
      - -X github.com/rokoucha/prospabitus/internal/cli.Commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - assets/SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
